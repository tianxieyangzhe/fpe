[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpe"
version = "0.1.0"
description = "Flow Path Explorer - AI-powered network link analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.20.0",
    "orjson>=3.0.0",
    "rich>=13.0.0",
    "paramiko>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
fpe = "fpe.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
